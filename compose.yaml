services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: maas
      POSTGRES_USER: maas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maas}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - maas-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maas -d maas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  maas-postgres:
