[project]
name = "maas-knowledge-cli"
version = "0.1.0"
description = "Deterministic live knowledge-index initialization for Me-as-a-Service"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11,<3",
    "pypdf>=6,<7",
    "pyyaml>=6,<7",
]

[project.scripts]
maas = "maas_knowledge.cli:main"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
    "types-pyyaml>=6,<7",
]

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "maas_knowledge"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
